[package]
name = "kadar"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "kadar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
sha1_smol = "1.0.1"
uuid = { version = "1.27.0", features = ["v4"] }

# macOS frameworks: ImageIO decodes and scales images, AVFoundation reads video frames.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSArray", "NSObject", "NSFileManager"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFNumber", "CFURL", "CFCGTypes", "CFData"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGContext", "CGColorSpace", "CGBitmapContext", "CGWindow"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVAsset", "AVAssetImageGenerator", "AVCaptureDevice", "AVMediaFormat", "AVVideoSettings", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
webp = { version = "0.3.1", default-features = false }
mozjpeg = "0.10.13"
slug = "0.1.6"
oxipng = { version = "10.2.1", default-features = false }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "libc", "SCShareableContent", "SCStream", "SCRecordingOutput", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "objc2-av-foundation"] }
block2 = "0.6.2"
tauri-plugin-window-state = "2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
tauri-plugin-drag = "2.1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
