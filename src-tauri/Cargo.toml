[package]
name = "kadar"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "kadar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
sha1_smol = "1.0.1"
uuid = { version = "1.27.0", features = ["v4"] }
# Encoders, the same on every system.
webp = { version = "0.3.1", default-features = false }
mozjpeg = "0.10.13"
slug = "0.1.6"
oxipng = { version = "10.2.1", default-features = false }
tauri-plugin-window-state = "2"

# macOS only: ImageIO decodes and scales images, AVFoundation reads video frames, ScreenCaptureKit
# records, AppKit does the clipboard and drag. Used only by src/platform/macos/. Windows and Linux
# get their own sections here, with their own system libraries (see the Roadmap in README.md).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSArray", "NSObject", "NSFileManager", "NSGeometry", "NSThread"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString", "CFDictionary", "CFNumber", "CFURL", "CFCGTypes", "CFData", "CFArray"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGImage", "CGContext", "CGColorSpace", "CGBitmapContext", "CGWindow"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVAsset", "AVAssetImageGenerator", "AVCaptureDevice", "AVMediaFormat", "AVVideoSettings", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMTime"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "libc", "SCShareableContent", "SCStream", "SCRecordingOutput", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "objc2-av-foundation"] }
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
libc = "0.2.190"

# Windows and Linux: one Kadar at a time ("Open with Kadar" on a second file goes to the open one).
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

# Windows only: WIC decodes and scales images, the shell gives video frames, the Recycle Bin and
# opening files, the clipboard holds copied files. Used only by src/platform/windows/.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
# The COM helpers the `windows` crate generates code against (`#[implement]`).
windows-core = "0.61"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
